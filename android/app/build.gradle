plugins {
    id 'com.android.application'
}

android {
    namespace 'com.jiaozhi.quiz'
    compileSdk 34

    defaultConfig {
        applicationId "com.jiaozhi.quiz"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            // 真机分发请自行配置签名；CI 默认产出 debug APK
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
