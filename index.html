<!-- AI生成 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>教资刷题</title>
<style>
  :root {
    --bg: #f3efe6;
    --bg-deep: #ebe4d6;
    --ink: #1a1f2b;
    --muted: #6b7280;
    --accent: #0e5c43;
    --accent-2: #167a58;
    --accent-ink: #f7f4ec;
    --accent-soft: #e4f0ea;
    --danger: #c45c4a;
    --danger-soft: #f8ebe8;
    --ok: #2f7a4d;
    --ok-soft: #e7f4eb;
    --gold: #b8923f;
    --card: #fffcf7;
    --line: #e2d9c8;
    --shadow: 0 8px 24px rgba(26, 31, 43, 0.06);
    --shadow-soft: 0 2px 10px rgba(26, 31, 43, 0.04);
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { max-width: 480px; margin: 0 auto; }
  body {
    font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background:
      radial-gradient(1200px 400px at 50% -80px, #e8f0ea 0%, transparent 55%),
      var(--bg);
    color: var(--ink);
    min-height: 100vh;
    padding-bottom: 84px;
    line-height: 1.5;
  }
  header {
    padding: 18px 18px 14px;
    background: linear-gradient(180deg, #0e5c43 0%, #14684c 55%, #1a7355 100%);
    color: var(--accent-ink);
    position: sticky;
    top: 0;
    z-index: 5;
    box-shadow: var(--shadow);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
  }
  .brand-mark {
    width: 34px;
    height: 34px;
    border-radius: 10px;
    background: rgba(255, 252, 247, 0.16);
    border: 1px solid rgba(255, 252, 247, 0.28);
    display: grid;
    place-items: center;
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0;
  }
  .brand h1 {
    margin: 0;
    font-size: 18px;
    font-weight: 650;
    letter-spacing: 0.04em;
  }
  .brand-sub {
    margin: 0;
    font-size: 11px;
    opacity: 0.78;
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }
  #bankMeta {
    font-size: 12px;
    opacity: 0.88;
    margin-top: 2px;
  }
  main { padding: 16px 14px 28px; }
  nav {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: 12px;
    width: min(452px, calc(100% - 24px));
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    background: rgba(255, 252, 247, 0.96);
    border: 1px solid var(--line);
    border-radius: 18px;
    box-shadow: 0 10px 30px rgba(26, 31, 43, 0.12);
    backdrop-filter: blur(8px);
    overflow: hidden;
  }
  nav button {
    border: 0;
    background: transparent;
    padding: 10px 0 11px;
    font-size: 11px;
    color: var(--muted);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 2px;
  }
  nav button .ico {
    width: 22px;
    height: 22px;
    border-radius: 7px;
    display: grid;
    place-items: center;
    font-size: 13px;
    background: transparent;
    transition: 0.15s ease;
  }
  nav button.active { color: var(--accent); font-weight: 600; }
  nav button.active .ico {
    background: var(--accent-soft);
    color: var(--accent);
  }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 16px;
    margin-bottom: 12px;
    box-shadow: var(--shadow-soft);
  }
  .card.hero {
    background:
      linear-gradient(135deg, #fffcf7 0%, #f3f8f4 100%);
    border-color: #d5e4db;
  }
  .muted { color: var(--muted); font-size: 13px; }
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    border: 0;
    border-radius: 12px;
    background: linear-gradient(180deg, var(--accent-2), var(--accent));
    color: var(--accent-ink);
    padding: 11px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    box-shadow: 0 4px 12px rgba(14, 92, 67, 0.18);
  }
  .btn:active { transform: translateY(1px); }
  .btn.ghost {
    background: #fffdf8;
    color: var(--ink);
    border: 1px solid var(--line);
    box-shadow: none;
    font-weight: 500;
  }
  .btn.danger {
    background: linear-gradient(180deg, #d06a58, var(--danger));
    box-shadow: 0 4px 12px rgba(196, 92, 74, 0.18);
  }
  .btn.block { width: 100%; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; align-items: center; }
  .opt {
    display: flex;
    width: 100%;
    text-align: left;
    gap: 12px;
    align-items: flex-start;
    border: 1px solid var(--line);
    border-radius: 14px;
    background: #fffdf8;
    padding: 12px 12px 12px 12px;
    margin-bottom: 10px;
    font-size: 15px;
    line-height: 1.45;
    cursor: pointer;
    transition: border-color 0.12s ease, background 0.12s ease, transform 0.08s ease;
  }
  .opt .bubble {
    flex: 0 0 28px;
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    display: grid;
    place-items: center;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
    background: var(--card);
    margin-top: 1px;
  }
  .opt .otext { flex: 1; padding-top: 3px; }
  .opt.selected {
    border-color: var(--accent-2);
    background: var(--accent-soft);
  }
  .opt.selected .bubble {
    border-color: var(--accent);
    background: var(--accent);
    color: #fff;
  }
  .opt.correct {
    border-color: var(--ok);
    background: var(--ok-soft);
  }
  .opt.correct .bubble {
    border-color: var(--ok);
    background: var(--ok);
    color: #fff;
  }
  .opt.wrong {
    border-color: var(--danger);
    background: var(--danger-soft);
  }
  .opt.wrong .bubble {
    border-color: var(--danger);
    background: var(--danger);
    color: #fff;
  }
  .badge {
    display: inline-flex;
    align-items: center;
    font-size: 11px;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--bg-deep);
    color: var(--muted);
    border: 1px solid transparent;
    margin-right: 6px;
    margin-bottom: 6px;
  }
  .badge.accent {
    background: var(--accent-soft);
    color: var(--accent);
    border-color: #cfe3d8;
  }
  .badge.gold {
    background: #f7efd9;
    color: var(--gold);
    border-color: #ead9a8;
  }
  h2 {
    font-size: 16px;
    margin: 0 0 8px;
    font-weight: 650;
    letter-spacing: 0.01em;
  }
  .stem {
    font-size: 17px;
    line-height: 1.65;
    margin: 10px 0 14px;
    font-weight: 500;
  }
  .qhead {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 4px;
  }
  .qindex {
    font-size: 12px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
  }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-top: 8px;
  }
  .stat {
    background: var(--bg-deep);
    border-radius: 12px;
    padding: 10px 8px;
    text-align: center;
  }
  .stat .n {
    font-size: 18px;
    font-weight: 700;
    color: var(--accent);
    font-variant-numeric: tabular-nums;
  }
  .stat .l {
    font-size: 11px;
    color: var(--muted);
    margin-top: 2px;
  }
  .hidden { display: none !important; }
  label { font-size: 14px; }
  select, input[type="number"] {
    font-size: 14px;
    padding: 8px 10px;
    border: 1px solid var(--line);
    border-radius: 10px;
    background: var(--card);
    color: var(--ink);
  }
  .result-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
  }
  .tag-ok { color: var(--ok); font-weight: 600; }
  .tag-bad { color: var(--danger); font-weight: 600; }
</style>
</head>
<body>
<p data-aigc-mark="1" style="margin:0 0 8px;font-size:10px;line-height:1.3;color:#6b6560;font-weight:400;">AI生成</p>

<header>
  <div class="brand">
    <div class="brand-mark">教</div>
    <div>
      <h1>教资刷题</h1>
      <p class="brand-sub">Gaoxiao · Practice</p>
    </div>
  </div>
  <div id="bankMeta">加载题库…</div>
</header>
<main id="main"></main>
<nav id="tabbar">
  <button data-tab="practice" class="active"><span class="ico">题</span>刷题</button>
  <button data-tab="wrong"><span class="ico">错</span>错题</button>
  <button data-tab="exam"><span class="ico">考</span>模考</button>
  <button data-tab="me"><span class="ico">我</span>我的</button>
</nav>
<script src="bank.js"></script>
<script>
(function () {
  const STATE_KEY = "jiaozhi_v1";
  const TYPE_LABEL = { single: "单选", multiple: "多选", judge: "判断" };
  const subjName = {
    edu: "高等教育学",
    psy: "高等教育心理学",
    law: "职业道德与法规",
    unknown: "其他",
  };

  let practiceSession = null;
  let examSession = null;

  function bankReady() {
    return Array.isArray(window.BANK) && window.BANK.length > 0;
  }

  function emptyState() {
    return {
      wrong: [],
      progress: {},
      exams: [],
      settings: { autoRemoveWrong: false },
    };
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STATE_KEY);
      if (!raw) return emptyState();
      const s = JSON.parse(raw);
      return {
        wrong: Array.isArray(s.wrong) ? s.wrong : [],
        progress: s.progress || {},
        exams: Array.isArray(s.exams) ? s.exams.slice(0, 20) : [],
        settings: {
          autoRemoveWrong: !!((s.settings || {}).autoRemoveWrong),
        },
      };
    } catch (e) {
      try {
        localStorage.removeItem(STATE_KEY);
      } catch (e2) {}
      return emptyState();
    }
  }

  function saveState(state) {
    try {
      localStorage.setItem(STATE_KEY, JSON.stringify(state));
    } catch (e) {
      alert("进度保存失败，已尝试继续");
    }
  }

  function scoreAnswer(type, userAnswer, keyAnswer) {
    const u = (userAnswer || []).slice().sort().join(",");
    const k = (keyAnswer || []).slice().sort().join(",");
    return u === k && u.length > 0;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
    );
  }

  function pickRandom(list, n) {
    const arr = list.slice();
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = arr[i];
      arr[i] = arr[j];
      arr[j] = t;
    }
    return arr.slice(0, Math.max(0, n));
  }

  function filterBySubject(subject) {
    if (!subject || subject === "all") return window.BANK.slice();
    return window.BANK.filter((q) => q.subject === subject);
  }

  function addWrong(state, q) {
    if (state.wrong.indexOf(q.uid) < 0) state.wrong.push(q.uid);
  }

  function removeWrong(state, uid) {
    state.wrong = state.wrong.filter((x) => x !== uid);
  }

  function showTab(name) {
    document.querySelectorAll("#tabbar button").forEach((b) => {
      b.classList.toggle("active", b.dataset.tab === name);
    });
    render(name);
  }

  function render(tab) {
    const main = document.getElementById("main");
    const meta = document.getElementById("bankMeta");
    if (!bankReady()) {
      meta.textContent = "题库未就绪";
      main.innerHTML =
        '<div class="card"><h2>题库未就绪</h2><p class="muted">请先生成 bank.js 再使用刷题功能。</p></div>';
      return;
    }
    meta.textContent =
      "题库 " +
      window.BANK.length +
      " · 高教 " +
      filterBySubject("edu").length +
      " · 心理 " +
      filterBySubject("psy").length +
      " · 法规 " +
      filterBySubject("law").length;
    if (tab === "practice") renderPractice(main);
    else if (tab === "wrong") renderWrong(main);
    else if (tab === "exam") renderExam(main);
    else renderMe(main);
  }

  function startSession(list, subject, modeLabel) {
    if (!list.length) {
      alert("该科暂无题");
      return;
    }
    practiceSession = {
      list: list.slice(),
      idx: 0,
      subject: subject,
      modeLabel: modeLabel,
      selected: [],
      locked: false,
    };
    JZ.showTab("practice");
  }

  function startSeq(subject) {
    startSession(filterBySubject(subject), subject, "顺序");
  }

  function startRand(subject) {
    const main = document.getElementById("main");
    const base = filterBySubject(subject);
    main.innerHTML =
      '<div class="card"><h2>随机抽题</h2>' +
      '<p class="muted">科目：' +
      (subject === "all" ? "全部" : subjName[subject] || subject) +
      " · 池内 " +
      base.length +
      " 题</p>" +
      '<label>题量 <select id="randN"><option>10</option><option selected>20</option><option>50</option><option value="custom">自定义</option></select></label> ' +
      '<input id="randCustom" class="hidden" type="number" min="1" placeholder="N" style="width:72px" />' +
      '<div class="row"><label><input type="checkbox" data-type="single" checked /> 单选</label>' +
      '<label><input type="checkbox" data-type="multiple" checked /> 多选</label>' +
      '<label><input type="checkbox" data-type="judge" checked /> 判断</label></div>' +
      '<div class="row"><button class="btn" id="randGo">开始</button>' +
      '<button class="btn ghost" id="randBack">返回</button></div></div>';
    const nSel = document.getElementById("randN");
    const nCustom = document.getElementById("randCustom");
    nSel.addEventListener("change", () =>
      nCustom.classList.toggle("hidden", nSel.value !== "custom")
    );
    document.getElementById("randBack").addEventListener("click", () => {
      practiceSession = null;
      JZ.showTab("practice");
    });
    document.getElementById("randGo").addEventListener("click", () => {
      const types = Array.from(
        main.querySelectorAll("input[data-type]:checked")
      ).map((x) => x.dataset.type);
      let n =
        nSel.value === "custom"
          ? parseInt(nCustom.value || "0", 10)
          : parseInt(nSel.value, 10);
      const pool = base.filter((q) => types.indexOf(q.type) >= 0);
      if (!n || n < 1) n = Math.min(20, pool.length);
      startSession(pickRandom(pool, n), subject, "随机");
    });
  }

  function renderPractice(main) {
    const state = JZ.loadState();
    if (!practiceSession) {
      const cards = ["edu", "psy", "law"]
        .map((s) => {
          const n = filterBySubject(s).length;
          const tag = s === "edu" ? "一" : s === "psy" ? "二" : "三";
          return (
            '<div class="card hero"><div class="qhead"><div><span class="badge gold">科目 ' +
            tag +
            '</span><h2 style="margin:4px 0 0">' +
            subjName[s] +
            '</h2></div><div class="qindex">' +
            n +
            " 题</div></div><div class=\"row\">" +
            '<button class="btn" data-go="seq" data-subject="' +
            s +
            '">顺序刷题</button>' +
            '<button class="btn ghost" data-go="rand" data-subject="' +
            s +
            '">随机抽题</button></div></div>'
          );
        })
        .join("");
      main.innerHTML =
        cards +
        '<div class="card"><h2>跨科随机</h2><p class="muted">打乱三科，自定题量与题型</p><div class="row">' +
        '<button class="btn block" data-go="rand" data-subject="all">全部科目随机</button>' +
        "</div></div>";
      main.querySelectorAll("[data-go]").forEach((b) => {
        b.addEventListener("click", () => {
          if (b.dataset.go === "seq") startSeq(b.dataset.subject);
          else startRand(b.dataset.subject);
        });
      });
      return;
    }
    drawQuestion(main, state);
  }

  function bubbleLabel(id) {
    if (id === "TRUE") return "对";
    if (id === "FALSE") return "错";
    return id;
  }

  function renderOptions(container, q, options) {
    container.innerHTML = options
      .map(
        (o) =>
          '<button type="button" class="opt" data-id="' +
          o.id +
          '"><span class="bubble">' +
          bubbleLabel(o.id) +
          '</span><span class="otext">' +
          escapeHtml(o.value) +
          "</span></button>"
      )
      .join("");
    container.querySelectorAll(".opt").forEach((btn) => {
      btn.addEventListener("click", () => onPick(btn, q));
    });
  }

  function onPick(btn, q) {
    if (!practiceSession || practiceSession.locked) return;
    const id = btn.dataset.id;
    if (q.type === "multiple") {
      btn.classList.toggle("selected");
    } else {
      document
        .querySelectorAll("#opts .opt")
        .forEach((b) => b.classList.remove("selected"));
      btn.classList.add("selected");
      practiceSession.selected = [id];
      lockAnswer(document.getElementById("main"), JZ.loadState(), false);
    }
  }

  function currentSelected() {
    return Array.from(document.querySelectorAll("#opts .opt.selected")).map(
      (b) => b.dataset.id
    );
  }

  function lockAnswer(main, state, isMultiple) {
    const s = practiceSession;
    if (!s || s.locked) return;
    const q = s.list[s.idx];
    const selected = isMultiple ? currentSelected() : s.selected;
    if (!selected.length) return;
    s.selected = selected;
    s.locked = true;
    const ok = JZ.scoreAnswer(q.type, selected, q.answer);
    document.querySelectorAll("#opts .opt").forEach((b) => {
      const id = b.dataset.id;
      const should = q.answer.indexOf(id) >= 0;
      if (should) b.classList.add("correct");
      else if (b.classList.contains("selected")) b.classList.add("wrong");
      b.disabled = true;
    });
    if (!ok) addWrong(state, q);
    else if (state.settings.autoRemoveWrong) removeWrong(state, q.uid);
    JZ.saveState(state);
    const actions = document.getElementById("actions");
    actions.innerHTML =
      '<div class="result-line" style="width:100%"><span class="' +
      (ok ? "tag-ok" : "tag-bad") +
      '">' +
      (ok ? "答对" : "答错 · 正确 " + q.answer.join("")) +
      '</span><button class="btn" id="nextBtn">下一题</button></div>';
    document.getElementById("nextBtn").addEventListener("click", () => {
      s.idx += 1;
      s.selected = [];
      s.locked = false;
      JZ.showTab("practice");
    });
  }

  function drawQuestion(main, state) {
    const s = practiceSession;
    const q = s.list[s.idx];
    if (!q) {
      practiceSession = null;
      renderPractice(main);
      return;
    }
    const typeLabel = TYPE_LABEL[q.type] || q.type;
    main.innerHTML =
      '<div class="card">' +
      '<div class="qhead"><div><span class="badge accent">' +
      typeLabel +
      '</span><span class="badge">' +
      s.modeLabel +
      '</span><span class="badge">' +
      (subjName[q.subject] || q.subject) +
      '</span></div><div class="qindex">' +
      (s.idx + 1) +
      "/" +
      s.list.length +
      '</div></div>' +
      '<div class="stem">' +
      escapeHtml(q.stem) +
      '</div><div id="opts"></div>' +
      '<div class="row" id="actions">' +
      '<button class="btn ghost" id="quitBtn">退出</button></div></div>';
    const opts = document.getElementById("opts");
    if (q.type === "judge") {
      renderOptions(opts, q, [
        { id: "TRUE", value: "正确" },
        { id: "FALSE", value: "错误" },
      ]);
    } else {
      renderOptions(opts, q, q.options);
    }
    const actions = document.getElementById("actions");
    document.getElementById("quitBtn").addEventListener("click", () => {
      practiceSession = null;
      JZ.showTab("practice");
    });
    if (q.type === "multiple") {
      const submit = document.createElement("button");
      submit.className = "btn";
      submit.id = "submitBtn";
      submit.textContent = "提交";
      actions.appendChild(submit);
      submit.addEventListener("click", () => lockAnswer(main, state, true));
    }
  }

  function renderWrong(main) {
    const state = JZ.loadState();
    const all = state.wrong
      .map((uid) => window.BANK.find((q) => q.uid === uid))
      .filter(Boolean);
    const missing = state.wrong.length - all.length;
    if (missing > 0) {
      state.wrong = all.map((q) => q.uid);
      JZ.saveState(state);
    }
    let filter = "all";
    function draw() {
      const list =
        filter === "all" ? all : all.filter((q) => q.subject === filter);
      main.innerHTML =
        '<div class="card"><h2>错题本</h2><p class="muted">' +
        all.length +
        " 题" +
        (missing ? "（已清理 " + missing + " 条失效）" : "") +
        '</p><div class="row">' +
        '<button class="btn ghost" data-f="all">全部</button>' +
        '<button class="btn ghost" data-f="edu">高教</button>' +
        '<button class="btn ghost" data-f="psy">心理</button>' +
        '<button class="btn ghost" data-f="law">道德法规</button>' +
        '<button class="btn" id="reWrong">重刷 ' +
        list.length +
        " 题</button></div></div>" +
        list
          .map(
            (q, i) =>
              '<div class="card"><div><span class="badge">' +
              (TYPE_LABEL[q.type] || "") +
              '</span><span class="badge">' +
              (subjName[q.subject] || q.subject) +
              '</span></div><div class="stem">' +
              escapeHtml(q.stem) +
              '</div><div class="row"><button class="btn ghost" data-off="' +
              i +
              '">移出</button></div></div>'
          )
          .join("");
      main.querySelectorAll("[data-f]").forEach((b) =>
        b.addEventListener("click", () => {
          filter = b.dataset.f;
          draw();
        })
      );
      main.querySelectorAll("[data-off]").forEach((b) =>
        b.addEventListener("click", () => {
          const q = list[parseInt(b.dataset.off, 10)];
          removeWrong(state, q.uid);
          JZ.saveState(state);
          renderWrong(main);
        })
      );
      const re = document.getElementById("reWrong");
      if (re)
        re.addEventListener("click", () => {
          if (!list.length) return;
          startSession(list.slice(), filter, "错题重刷");
        });
    }
    draw();
  }

  function assemblePaper(bank, opts) {
    const types =
      opts.types && opts.types.length
        ? opts.types
        : ["single", "multiple", "judge"];
    const pool = bank.filter(
      (q) =>
        types.indexOf(q.type) >= 0 &&
        (!opts.subject || opts.subject === "all" || q.subject === opts.subject)
    );
    if (opts.mode === "randomN") {
      return pickRandom(pool, opts.n || 20);
    }
    const quota = { single: 40, multiple: 20, judge: 20 };
    const picked = [];
    const used = new Set();
    const lack = [];
    ["single", "multiple", "judge"].forEach((t) => {
      if (types.indexOf(t) < 0) return;
      const seg = pickRandom(
        pool.filter((q) => q.type === t && !used.has(q.uid)),
        quota[t]
      );
      seg.forEach((q) => {
        used.add(q.uid);
        picked.push(q);
      });
      if (seg.length < quota[t]) lack.push(t + "不足" + quota[t]);
    });
    const totalWant = 80;
    if (picked.length < totalWant) {
      const rest = pickRandom(
        pool.filter((q) => !used.has(q.uid)),
        totalWant - picked.length
      );
      rest.forEach((q) => {
        used.add(q.uid);
        picked.push(q);
      });
    }
    picked.lackHint = lack.length ? lack.join("；") : "";
    return picked;
  }

  function renderExam(main) {
    const state = JZ.loadState();
    if (!examSession) {
      main.innerHTML =
        '<div class="card"><h2>模拟考试</h2>' +
        '<p class="muted">默认 40 单选 + 20 多选 + 20 判断；多选全对才算对；交卷后显示答案。</p>' +
        '<div class="row"><label>模式 <select id="exMode"><option value="classic">标准 80 题</option><option value="randomN">随机 N 题</option></select></label></div>' +
        '<div class="row"><label>N <input id="exN" type="number" value="20" min="1" style="width:72px" disabled /></label>' +
        '<label>限时（分） <select id="exMin"><option>30</option><option>60</option><option>90</option><option selected>100</option><option>120</option><option value="0">不限时</option></select></label></div>' +
        '<div class="row"><label><input type="checkbox" data-type="single" checked /> 单</label>' +
        '<label><input type="checkbox" data-type="multiple" checked /> 多</label>' +
        '<label><input type="checkbox" data-type="judge" checked /> 判</label></div>' +
        '<div class="row"><button class="btn" id="exGo">开始考试</button></div></div>' +
        '<div class="card"><h2>最近成绩</h2>' +
        (state.exams.length
          ? state.exams
              .map(
                (e) =>
                  '<p class="muted">' +
                  e.at +
                  " · " +
                  e.right +
                  "/" +
                  e.total +
                  " · " +
                  e.modeLabel +
                  "</p>"
              )
              .join("")
          : '<p class="muted">暂无记录</p>') +
        "</div>";
      const mode = document.getElementById("exMode");
      const nInput = document.getElementById("exN");
      mode.addEventListener("change", () => {
        nInput.disabled = mode.value !== "randomN";
      });
      document.getElementById("exGo").addEventListener("click", () => {
        const types = Array.from(
          main.querySelectorAll("input[data-type]:checked")
        ).map((x) => x.dataset.type);
        const opts = {
          mode: mode.value,
          n: parseInt(nInput.value || "20", 10),
          types: types,
          subject: "all",
        };
        const list = assemblePaper(window.BANK, opts);
        if (!list.length) {
          alert("题量不足，无法组卷");
          return;
        }
        const minutes = parseInt(document.getElementById("exMin").value, 10);
        examSession = {
          list: list,
          idx: 0,
          answers: {},
          deadline: minutes > 0 ? Date.now() + minutes * 60000 : null,
          modeLabel: opts.mode === "classic" ? "标准卷" : "随机" + opts.n,
          lackHint: list.lackHint || "",
          submitted: false,
          timer: null,
        };
        if (examSession.lackHint)
          alert("题型不足已自动补齐：" + examSession.lackHint);
        drawExam(main);
      });
      return;
    }
    drawExam(main);
  }

  function drawExam(main) {
    const s = examSession;
    if (!s || s.submitted) return drawExamResult(main);
    const q = s.list[s.idx];
    const left = s.deadline
      ? Math.max(0, Math.floor((s.deadline - Date.now()) / 1000))
      : null;
    const timeTxt =
      left == null
        ? "不限时"
        : "剩余 " +
          Math.floor(left / 60) +
          ":" +
          String(left % 60).padStart(2, "0");
    main.innerHTML =
      '<div class="card"><div><span class="badge">' +
      (TYPE_LABEL[q.type] || "") +
      '</span><span class="badge">' +
      (s.idx + 1) +
      "/" +
      s.list.length +
      '</span><span class="badge" id="exClock">' +
      timeTxt +
      '</span></div><div class="stem">' +
      escapeHtml(q.stem) +
      '</div><div id="opts"></div><div class="row">' +
      '<button class="btn ghost" id="exPrev">上一题</button>' +
      '<button class="btn ghost" id="exNext">下一题</button>' +
      '<button class="btn" id="exSubmit">交卷</button></div></div>';
    const opts = document.getElementById("opts");
    const choices =
      q.type === "judge"
        ? [
            { id: "TRUE", value: "正确" },
            { id: "FALSE", value: "错误" },
          ]
        : q.options;
    const saved = s.answers[q.uid] || [];
    opts.innerHTML = choices
      .map((o) => {
        const sel = saved.indexOf(o.id) >= 0 ? " selected" : "";
        return (
          '<button type="button" class="opt' +
          sel +
          '" data-id="' +
          o.id +
          '"><span class="bubble">' +
          (o.id === "TRUE" ? "对" : o.id === "FALSE" ? "错" : o.id) +
          '</span><span class="otext">' +
          escapeHtml(o.value) +
          "</span></button>"
        );
      })
      .join("");
    opts.querySelectorAll(".opt").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.id;
        let cur = (s.answers[q.uid] || []).slice();
        if (q.type === "multiple") {
          const i = cur.indexOf(id);
          if (i >= 0) cur.splice(i, 1);
          else cur.push(id);
          btn.classList.toggle("selected");
        } else {
          cur = [id];
          opts.querySelectorAll(".opt").forEach((b) =>
            b.classList.remove("selected")
          );
          btn.classList.add("selected");
        }
        s.answers[q.uid] = cur;
      });
    });
    document.getElementById("exPrev").addEventListener("click", () => {
      if (s.idx > 0) s.idx -= 1;
      drawExam(main);
    });
    document.getElementById("exNext").addEventListener("click", () => {
      if (s.idx < s.list.length - 1) s.idx += 1;
      drawExam(main);
    });
    document
      .getElementById("exSubmit")
      .addEventListener("click", () => submitExam(main, false));
    if (s.deadline) {
      if (s.timer) clearInterval(s.timer);
      s.timer = setInterval(() => {
        if (!examSession || examSession.submitted) return;
        if (Date.now() >= s.deadline) {
          clearInterval(s.timer);
          submitExam(document.getElementById("main"), true);
        } else {
          const el = document.getElementById("exClock");
          if (el) {
            const sec = Math.max(
              0,
              Math.floor((s.deadline - Date.now()) / 1000)
            );
            el.textContent =
              "剩余 " +
              Math.floor(sec / 60) +
              ":" +
              String(sec % 60).padStart(2, "0");
          }
        }
      }, 1000);
    }
  }

  function submitExam(main, auto) {
    const s = examSession;
    if (!s || s.submitted) return;
    s.submitted = true;
    if (s.timer) clearInterval(s.timer);
    let right = 0;
    s.list.forEach((q) => {
      const ok = JZ.scoreAnswer(
        q.type,
        s.answers[q.uid] || [],
        q.answer
      );
      if (ok) right += 1;
    });
    const state = JZ.loadState();
    state.exams.unshift({
      at: new Date().toISOString().slice(0, 16).replace("T", " "),
      right: right,
      total: s.list.length,
      modeLabel: s.modeLabel + (auto ? "（自动交卷）" : ""),
    });
    state.exams = state.exams.slice(0, 20);
    JZ.saveState(state);
    drawExamResult(main, right, auto);
  }

  function drawExamResult(main, rightArg, auto) {
    const s = examSession;
    if (!s) return renderExam(main);
    let right = rightArg;
    if (right == null) {
      right = s.list.reduce(
        (n, q) =>
          n +
          (JZ.scoreAnswer(q.type, s.answers[q.uid] || [], q.answer) ? 1 : 0),
        0
      );
    }
    main.innerHTML =
      '<div class="card"><h2>考试结果' +
      (auto ? "（到时自动交卷）" : "") +
      '</h2><p class="stem">' +
      right +
      " / " +
      s.list.length +
      '</p><div class="row"><button class="btn" id="exDone">返回</button>' +
      '<button class="btn ghost" id="exToWrong">错题入本</button></div></div>' +
      s.list
        .map((q) => {
          const ok = JZ.scoreAnswer(
            q.type,
            s.answers[q.uid] || [],
            q.answer
          );
          const you = (s.answers[q.uid] || []).join("") || "—";
          return (
            '<div class="card"><div><span class="badge">' +
            (ok ? "对" : "错") +
            '</span><span class="badge">' +
            (TYPE_LABEL[q.type] || "") +
            '</span></div><div class="stem">' +
            escapeHtml(q.stem) +
            '</div><p class="muted">你的答案 ' +
            escapeHtml(you) +
            " · 正确 " +
            escapeHtml(q.answer.join("")) +
            "</p></div>"
          );
        })
        .join("");
    document.getElementById("exDone").addEventListener("click", () => {
      examSession = null;
      renderExam(main);
    });
    document.getElementById("exToWrong").addEventListener("click", () => {
      const state = JZ.loadState();
      s.list.forEach((q) => {
        if (!JZ.scoreAnswer(q.type, s.answers[q.uid] || [], q.answer))
          addWrong(state, q);
      });
      JZ.saveState(state);
      alert("错题已入本");
    });
  }

  function renderMe(main) {
    const state = JZ.loadState();
    const total = window.BANK.length;
    main.innerHTML =
      '<div class="card"><h2>我的</h2>' +
      '<div class="stat-grid"><div class="stat"><div class="n">' +
      total +
      '</div><div class="l">题库</div></div><div class="stat"><div class="n">' +
      state.wrong.length +
      '</div><div class="l">错题</div></div><div class="stat"><div class="n">' +
      state.exams.length +
      '</div><div class="l">模考</div></div></div>' +
      '<p class="muted" style="margin-top:12px">多选计分：全对才算对（固定）</p>' +
      '<label><input type="checkbox" id="autoOff" ' +
      (state.settings.autoRemoveWrong ? "checked" : "") +
      " /> 错题做对后自动移出</label>" +
      '<div class="row"><button class="btn danger" id="clearAll">清空进度与错题</button></div></div>';
    document.getElementById("autoOff").addEventListener("change", (e) => {
      state.settings.autoRemoveWrong = e.target.checked;
      JZ.saveState(state);
    });
    document.getElementById("clearAll").addEventListener("click", () => {
      if (!confirm("确认清空错题与进度？")) return;
      const s = emptyState();
      s.settings = state.settings;
      JZ.saveState(s);
      renderMe(main);
    });
  }

  document.getElementById("tabbar").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-tab]");
    if (btn) {
      if (btn.dataset.tab !== "practice") practiceSession = practiceSession;
      if (btn.dataset.tab !== "exam") {
        /* keep exam session if in exam */
      }
      showTab(btn.dataset.tab);
    }
  });

  window.JZ = {
    scoreAnswer: scoreAnswer,
    loadState: loadState,
    saveState: saveState,
    showTab: showTab,
    bankReady: bankReady,
    TYPE_LABEL: TYPE_LABEL,
    assemblePaper: assemblePaper,
    pickRandom: pickRandom,
  };
  showTab("practice");
})();
</script>
