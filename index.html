<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#7C3AED" />
<title>教资刷题</title>
<link rel="stylesheet" href="assets/design-tokens.css" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { max-width: 480px; margin: 0 auto; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    font-size: var(--text-base);
    line-height: 1.5;
    color: var(--color-foreground);
    background: var(--color-background);
    min-height: 100vh;
    padding-bottom: calc(88px + env(safe-area-inset-bottom, 0px));
  }
  button, input, select { font: inherit; cursor: pointer; }
  button:focus-visible, a:focus-visible, select:focus-visible, input:focus-visible {
    outline: 2px solid var(--color-ring);
    outline-offset: 2px;
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { transition: none !important; animation: none !important; }
  }

  .icon {
    width: 22px;
    height: 22px;
    flex: 0 0 auto;
    stroke: currentColor;
    fill: none;
    stroke-width: 1.75;
    stroke-linecap: round;
    stroke-linejoin: round;
  }
  .icon-sm { width: 18px; height: 18px; }

  header.app {
    position: sticky;
    top: 0;
    z-index: 20;
    padding: calc(14px + env(safe-area-inset-top, 0px)) var(--space-page) 14px;
    background: linear-gradient(180deg, var(--color-primary), var(--color-secondary));
    color: var(--color-on-primary);
  }
  .brand {
    display: flex;
    align-items: center;
    gap: var(--space-3);
  }
  .brand-mark {
    width: 40px;
    height: 40px;
    border-radius: var(--radius-md);
    background: rgba(255,255,255,0.18);
    border: 1px solid rgba(255,255,255,0.3);
    display: grid;
    place-items: center;
  }
  .brand-mark svg { width: 22px; height: 22px; }
  .brand h1 {
    margin: 0;
    font-size: var(--text-lg);
    font-weight: 650;
    letter-spacing: 0.02em;
  }
  .brand p {
    margin: 2px 0 0;
    font-size: var(--text-xs);
    opacity: 0.85;
    letter-spacing: 0.08em;
  }
  #bankMeta {
    margin-top: 10px;
    font-size: var(--text-xs);
    opacity: 0.9;
  }

  main {
    padding: var(--space-4) var(--space-page) var(--space-8);
  }

  nav.tabbar {
    position: fixed;
    left: 50%;
    transform: translateX(-50%);
    bottom: calc(10px + env(safe-area-inset-bottom, 0px));
    width: min(452px, calc(100% - 24px));
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: var(--space-1);
    padding: 6px;
    background: rgba(255,255,255,0.96);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-xl);
    box-shadow: var(--shadow-nav);
    backdrop-filter: blur(10px);
    z-index: 30;
  }
  nav.tabbar button {
    min-height: var(--hit-min);
    border: 0;
    border-radius: var(--radius-md);
    background: transparent;
    color: var(--color-muted-foreground);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 2px;
    font-size: var(--text-xs);
    transition: background 0.18s ease, color 0.18s ease;
  }
  nav.tabbar button.active {
    background: var(--color-muted);
    color: var(--color-primary);
    font-weight: 600;
  }

  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius-card);
    box-shadow: var(--shadow-sm);
    padding: var(--space-card);
    margin-bottom: var(--space-3);
    transition: box-shadow 0.2s ease, border-color 0.2s ease;
  }
  .card.hero { background: linear-gradient(145deg, #fff 0%, var(--color-violet-50) 100%); }
  .muted { color: var(--color-muted-foreground); font-size: var(--text-sm); }
  h2 {
    margin: 0 0 var(--space-2);
    font-size: var(--text-md);
    font-weight: 650;
    letter-spacing: 0.01em;
  }
  .stem {
    margin: var(--space-3) 0 var(--space-4);
    font-size: var(--text-md);
    line-height: 1.65;
    font-weight: 500;
  }

  .btn {
    min-height: var(--hit-min);
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    border: 0;
    border-radius: var(--radius-control);
    padding: 0 18px;
    background: var(--button-bg);
    color: var(--button-fg);
    font-size: var(--text-base);
    font-weight: 600;
    box-shadow: 0 4px 14px rgba(124, 58, 237, 0.22);
    transition: transform 0.12s ease, filter 0.15s ease;
  }
  .btn:hover { filter: brightness(1.05); }
  .btn:active { transform: scale(0.98); }
  .btn.ghost {
    background: var(--color-card);
    color: var(--color-foreground);
    border: 1px solid var(--color-border);
    box-shadow: none;
    font-weight: 500;
  }
  .btn.danger {
    background: var(--color-destructive);
    box-shadow: 0 4px 14px rgba(220, 38, 38, 0.2);
  }
  .btn.block { width: 100%; }
  .row {
    display: flex;
    flex-wrap: wrap;
    gap: var(--space-2);
    margin-top: var(--space-3);
    align-items: center;
  }

  .badge {
    display: inline-flex;
    align-items: center;
    min-height: 24px;
    padding: 0 10px;
    border-radius: var(--radius-pill);
    background: var(--color-muted);
    color: var(--color-muted-foreground);
    font-size: var(--text-xs);
    margin-right: 6px;
    margin-bottom: 6px;
    white-space: nowrap;
  }
  .badge.accent {
    background: var(--color-muted);
    color: var(--color-primary);
    border: 1px solid var(--color-border);
  }
  .badge.gold {
    background: #FEF6E8;
    color: var(--color-warning, #D97706);
  }

  .opt {
    display: flex;
    width: 100%;
    min-height: var(--hit-min);
    align-items: flex-start;
    gap: var(--space-3);
    text-align: left;
    border: 1.5px solid var(--option-border);
    border-radius: var(--radius-control);
    background: var(--option-bg);
    padding: 12px;
    margin-bottom: var(--space-2);
    font-size: var(--text-base);
    line-height: 1.45;
    transition: border-color 0.15s ease, background 0.15s ease;
  }
  .opt .bubble {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 1.5px solid var(--color-border);
    display: grid;
    place-items: center;
    font-size: var(--text-xs);
    font-weight: 700;
    color: var(--color-muted-foreground);
    margin-top: 2px;
  }
  .opt .otext { flex: 1; padding-top: 3px; min-width: 0; }
  .opt.selected {
    border-color: var(--color-primary);
    background: var(--option-selected-bg);
  }
  .opt.selected .bubble {
    background: var(--color-primary);
    border-color: var(--color-primary);
    color: var(--color-on-primary);
  }
  .opt.correct {
    border-color: var(--color-success);
    background: var(--option-correct-bg);
  }
  .opt.correct .bubble {
    background: var(--color-success);
    border-color: var(--color-success);
    color: var(--color-on-primary);
  }
  .opt.wrong {
    border-color: var(--color-destructive);
    background: var(--option-wrong-bg);
  }
  .opt.wrong .bubble {
    background: var(--color-destructive);
    border-color: var(--color-destructive);
    color: var(--color-on-primary);
  }

  .qhead {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    gap: var(--space-2);
  }
  .qindex {
    font-size: var(--text-xs);
    color: var(--color-muted-foreground);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
    padding-top: 4px;
  }
  .stat-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: var(--space-2);
    margin-top: var(--space-3);
  }
  .stat {
    background: var(--color-muted);
    border-radius: var(--radius-md);
    padding: 12px 8px;
    text-align: center;
  }
  .stat .n {
    font-size: var(--text-lg);
    font-weight: 700;
    color: var(--color-primary);
    font-variant-numeric: tabular-nums;
  }
  .stat .l {
    font-size: var(--text-xs);
    color: var(--color-muted-foreground);
    margin-top: 2px;
  }
  .result-line {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: var(--space-2);
    width: 100%;
    flex-wrap: wrap;
  }
  .tag-ok { color: var(--color-success); font-weight: 650; display: inline-flex; align-items: center; gap: 6px; }
  .tag-bad { color: var(--color-destructive); font-weight: 650; display: inline-flex; align-items: center; gap: 6px; }
  .hidden { display: none !important; }
  label { font-size: var(--text-base); }
  select, input[type="number"] {
    min-height: 44px;
    padding: 8px 10px;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-control);
    background: var(--color-card);
    color: var(--color-foreground);
  }
  .icon-row {
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }

  @media (min-width: 768px) {
    main { max-width: 480px; margin: 0 auto; }
  }
</style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg" style="display:none" aria-hidden="true">
  <symbol id="i-book" viewBox="0 0 24 24"><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></symbol>
  <symbol id="i-x-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m15 9-6 6M9 9l6 6"/></symbol>
  <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>
  <symbol id="i-user" viewBox="0 0 24 24"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></symbol>
  <symbol id="i-check-circle" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m9 12 2 2 4-4"/></symbol>
  <symbol id="i-shuffle" viewBox="0 0 24 24"><path d="M16 3h5v5"/><path d="M4 20 21 3"/><path d="M21 16v5h-5"/><path d="m15 15 6 6"/><path d="M4 4l5 5"/></symbol>
  <symbol id="i-list" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
  <symbol id="i-pencil" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
</svg>

<header class="app">
  <div class="brand">
    <div class="brand-mark" aria-hidden="true">
      <svg class="icon" style="stroke:#fff"><use href="#i-book"/></svg>
    </div>
    <div>
      <h1>教资刷题</h1>
      <p>EXAM PRACTICE</p>
    </div>
  </div>
  <div id="bankMeta">加载题库…</div>
</header>
<main id="main"></main>
<nav class="tabbar" id="tabbar" aria-label="主导航">
  <button type="button" data-tab="practice" class="active" aria-current="page">
    <svg class="icon" aria-hidden="true"><use href="#i-book"/></svg>刷题
  </button>
  <button type="button" data-tab="wrong">
    <svg class="icon" aria-hidden="true"><use href="#i-x-circle"/></svg>错题
  </button>
  <button type="button" data-tab="exam">
    <svg class="icon" aria-hidden="true"><use href="#i-clock"/></svg>模考
  </button>
  <button type="button" data-tab="me">
    <svg class="icon" aria-hidden="true"><use href="#i-user"/></svg>我的
  </button>
</nav>
<script src="bank.js"></script>
<script>
(function () {
  const STATE_KEY = "jiaozhi_v1";
  const TYPE_LABEL = { single: "单选", multiple: "多选", judge: "判断" };
  const subjName = {
    edu: "高等教育学",
    psy: "高等教育心理学",
    law: "职业道德与法规",
    unknown: "其他",
  };

  let practiceSession = null;
  let examSession = null;

  function bankReady() {
    return Array.isArray(window.BANK) && window.BANK.length > 0;
  }

  function emptyState() {
    return {
      wrong: [],
      progress: {},
      exams: [],
      settings: { autoRemoveWrong: false },
    };
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STATE_KEY);
      if (!raw) return emptyState();
      const s = JSON.parse(raw);
      return {
        wrong: Array.isArray(s.wrong) ? s.wrong : [],
        progress: s.progress || {},
        exams: Array.isArray(s.exams) ? s.exams.slice(0, 20) : [],
        settings: {
          autoRemoveWrong: !!((s.settings || {}).autoRemoveWrong),
        },
      };
    } catch (e) {
      try {
        localStorage.removeItem(STATE_KEY);
      } catch (e2) {}
      return emptyState();
    }
  }

  function saveState(state) {
    try {
      localStorage.setItem(STATE_KEY, JSON.stringify(state));
    } catch (e) {
      alert("进度保存失败，已尝试继续");
    }
  }

  function scoreAnswer(type, userAnswer, keyAnswer) {
    const u = (userAnswer || []).slice().sort().join(",");
    const k = (keyAnswer || []).slice().sort().join(",");
    return u === k && u.length > 0;
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
    );
  }

  function icon(name, cls) {
    return (
      '<svg class="icon ' +
      (cls || "") +
      '" aria-hidden="true"><use href="#i-' +
      name +
      '"/></svg>'
    );
  }

  function bubbleLabel(id) {
    if (id === "TRUE") return "对";
    if (id === "FALSE") return "错";
    return id;
  }

  function pickRandom(list, n) {
    const arr = list.slice();
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      const t = arr[i];
      arr[i] = arr[j];
      arr[j] = t;
    }
    return arr.slice(0, Math.max(0, n));
  }

  function filterBySubject(subject) {
    if (!subject || subject === "all") return window.BANK.slice();
    return window.BANK.filter((q) => q.subject === subject);
  }

  function addWrong(state, q) {
    if (state.wrong.indexOf(q.uid) < 0) state.wrong.push(q.uid);
  }

  function removeWrong(state, uid) {
    state.wrong = state.wrong.filter((x) => x !== uid);
  }

  function showTab(name) {
    document.querySelectorAll("#tabbar button").forEach((b) => {
      const on = b.dataset.tab === name;
      b.classList.toggle("active", on);
      if (on) b.setAttribute("aria-current", "page");
      else b.removeAttribute("aria-current");
    });
    render(name);
  }

  function render(tab) {
    const main = document.getElementById("main");
    const meta = document.getElementById("bankMeta");
    if (!bankReady()) {
      meta.textContent = "题库未就绪";
      main.innerHTML =
        '<div class="card"><h2>题库未就绪</h2><p class="muted">请先生成 bank.js 再使用刷题功能。</p></div>';
      return;
    }
    meta.textContent =
      "题库 " +
      window.BANK.length +
      " · 高教 " +
      filterBySubject("edu").length +
      " · 心理 " +
      filterBySubject("psy").length +
      " · 法规 " +
      filterBySubject("law").length;
    if (tab === "practice") renderPractice(main);
    else if (tab === "wrong") renderWrong(main);
    else if (tab === "exam") renderExam(main);
    else renderMe(main);
  }

  function startSession(list, subject, modeLabel) {
    if (!list.length) {
      alert("该科暂无题");
      return;
    }
    practiceSession = {
      list: list.slice(),
      idx: 0,
      subject: subject,
      modeLabel: modeLabel,
      selected: [],
      locked: false,
    };
    JZ.showTab("practice");
  }

  function startSeq(subject) {
    startSession(filterBySubject(subject), subject, "顺序");
  }

  function startRand(subject) {
    const main = document.getElementById("main");
    const base = filterBySubject(subject);
    main.innerHTML =
      '<div class="card"><h2>' +
      icon("shuffle") +
      " 随机抽题</h2>" +
      '<p class="muted">科目：' +
      (subject === "all" ? "全部" : subjName[subject] || subject) +
      " · 池内 " +
      base.length +
      " 题</p>" +
      '<div class="row"><label for="randN">题量</label> <select id="randN"><option>10</option><option selected>20</option><option>50</option><option value="custom">自定义</option></select> ' +
      '<input id="randCustom" class="hidden" type="number" min="1" placeholder="N" aria-label="自定义题量" style="width:88px" /></div>' +
      '<div class="row"><label><input type="checkbox" data-type="single" checked /> 单选</label>' +
      '<label><input type="checkbox" data-type="multiple" checked /> 多选</label>' +
      '<label><input type="checkbox" data-type="judge" checked /> 判断</label></div>' +
      '<div class="row"><button type="button" class="btn" id="randGo">开始</button>' +
      '<button type="button" class="btn ghost" id="randBack">返回</button></div></div>';
    const nSel = document.getElementById("randN");
    const nCustom = document.getElementById("randCustom");
    nSel.addEventListener("change", () =>
      nCustom.classList.toggle("hidden", nSel.value !== "custom")
    );
    document.getElementById("randBack").addEventListener("click", () => {
      practiceSession = null;
      JZ.showTab("practice");
    });
    document.getElementById("randGo").addEventListener("click", () => {
      const types = Array.from(
        main.querySelectorAll("input[data-type]:checked")
      ).map((x) => x.dataset.type);
      let n =
        nSel.value === "custom"
          ? parseInt(nCustom.value || "0", 10)
          : parseInt(nSel.value, 10);
      const pool = base.filter((q) => types.indexOf(q.type) >= 0);
      if (!n || n < 1) n = Math.min(20, pool.length);
      startSession(pickRandom(pool, n), subject, "随机");
    });
  }

  function renderPractice(main) {
    const state = JZ.loadState();
    if (!practiceSession) {
      const cards = ["edu", "psy", "law"]
        .map((s, i) => {
          const n = filterBySubject(s).length;
          const tag = ["一", "二", "三"][i];
          return (
            '<div class="card hero"><div class="qhead"><div><span class="badge gold">科目 ' +
            tag +
            '</span><h2 style="margin:4px 0 0">' +
            icon("book", "icon-sm") +
            " " +
            subjName[s] +
            '</h2></div><div class="qindex">' +
            n +
            ' 题</div></div><div class="row">' +
            '<button type="button" class="btn" data-go="seq" data-subject="' +
            s +
            '">' +
            icon("list", "icon-sm") +
            "顺序刷题</button>" +
            '<button type="button" class="btn ghost" data-go="rand" data-subject="' +
            s +
            '">' +
            icon("shuffle", "icon-sm") +
            "随机抽题</button></div></div>"
          );
        })
        .join("");
      main.innerHTML =
        cards +
        '<div class="card"><h2>' +
        icon("shuffle", "icon-sm") +
        ' 跨科随机</h2><p class="muted">打乱三科，自定题量与题型</p><div class="row">' +
        '<button type="button" class="btn block" data-go="rand" data-subject="all">全部科目随机</button>' +
        "</div></div>";
      main.querySelectorAll("[data-go]").forEach((b) => {
        b.addEventListener("click", () => {
          if (b.dataset.go === "seq") startSeq(b.dataset.subject);
          else startRand(b.dataset.subject);
        });
      });
      return;
    }
    drawQuestion(main, state);
  }

  function renderOptions(container, q, options) {
    container.innerHTML = options
      .map(
        (o) =>
          '<button type="button" class="opt" data-id="' +
          o.id +
          '"><span class="bubble">' +
          bubbleLabel(o.id) +
          '</span><span class="otext">' +
          escapeHtml(o.value) +
          "</span></button>"
      )
      .join("");
    container.querySelectorAll(".opt").forEach((btn) => {
      btn.addEventListener("click", () => onPick(btn, q));
    });
  }

  function onPick(btn, q) {
    if (!practiceSession || practiceSession.locked) return;
    const id = btn.dataset.id;
    if (q.type === "multiple") {
      btn.classList.toggle("selected");
    } else {
      document
        .querySelectorAll("#opts .opt")
        .forEach((b) => b.classList.remove("selected"));
      btn.classList.add("selected");
      practiceSession.selected = [id];
      lockAnswer(document.getElementById("main"), JZ.loadState(), false);
    }
  }

  function currentSelected() {
    return Array.from(document.querySelectorAll("#opts .opt.selected")).map(
      (b) => b.dataset.id
    );
  }

  function lockAnswer(main, state, isMultiple) {
    const s = practiceSession;
    if (!s || s.locked) return;
    const q = s.list[s.idx];
    const selected = isMultiple ? currentSelected() : s.selected;
    if (!selected.length) return;
    s.selected = selected;
    s.locked = true;
    const ok = JZ.scoreAnswer(q.type, selected, q.answer);
    document.querySelectorAll("#opts .opt").forEach((b) => {
      const id = b.dataset.id;
      const should = q.answer.indexOf(id) >= 0;
      if (should) b.classList.add("correct");
      else if (b.classList.contains("selected")) b.classList.add("wrong");
      b.disabled = true;
    });
    if (!ok) addWrong(state, q);
    else if (state.settings.autoRemoveWrong) removeWrong(state, q.uid);
    JZ.saveState(state);
    const actions = document.getElementById("actions");
    actions.innerHTML =
      '<div class="result-line"><span class="' +
      (ok ? "tag-ok" : "tag-bad") +
      '">' +
      icon(ok ? "check-circle" : "x-circle", "icon-sm") +
      (ok ? "答对" : "答错 · 正确 " + q.answer.join("")) +
      '</span><button type="button" class="btn" id="nextBtn">下一题</button></div>';
    document.getElementById("nextBtn").addEventListener("click", () => {
      s.idx += 1;
      s.selected = [];
      s.locked = false;
      JZ.showTab("practice");
    });
  }

  function drawQuestion(main, state) {
    const s = practiceSession;
    const q = s.list[s.idx];
    if (!q) {
      practiceSession = null;
      renderPractice(main);
      return;
    }
    const typeLabel = TYPE_LABEL[q.type] || q.type;
    main.innerHTML =
      '<div class="card">' +
      '<div class="qhead"><div><span class="badge accent">' +
      typeLabel +
      '</span><span class="badge">' +
      s.modeLabel +
      '</span><span class="badge">' +
      (subjName[q.subject] || q.subject) +
      '</span></div><div class="qindex">' +
      (s.idx + 1) +
      "/" +
      s.list.length +
      '</div></div>' +
      '<div class="stem">' +
      escapeHtml(q.stem) +
      '</div><div id="opts"></div>' +
      '<div class="row" id="actions">' +
      '<button type="button" class="btn ghost" id="quitBtn">退出</button></div></div>';
    const opts = document.getElementById("opts");
    if (q.type === "judge") {
      renderOptions(opts, q, [
        { id: "TRUE", value: "正确" },
        { id: "FALSE", value: "错误" },
      ]);
    } else {
      renderOptions(opts, q, q.options);
    }
    const actions = document.getElementById("actions");
    document.getElementById("quitBtn").addEventListener("click", () => {
      practiceSession = null;
      JZ.showTab("practice");
    });
    if (q.type === "multiple") {
      const submit = document.createElement("button");
      submit.type = "button";
      submit.className = "btn";
      submit.id = "submitBtn";
      submit.textContent = "提交";
      actions.appendChild(submit);
      submit.addEventListener("click", () => lockAnswer(main, state, true));
    }
  }

  function renderWrong(main) {
    const state = JZ.loadState();
    const all = state.wrong
      .map((uid) => window.BANK.find((q) => q.uid === uid))
      .filter(Boolean);
    const missing = state.wrong.length - all.length;
    if (missing > 0) {
      state.wrong = all.map((q) => q.uid);
      JZ.saveState(state);
    }
    let filter = "all";
    function draw() {
      const list =
        filter === "all" ? all : all.filter((q) => q.subject === filter);
      const emptyArt =
        !all.length
          ? '<div class="card" style="text-align:center"><img src="assets/empty-state.png" alt="" width="160" height="160" style="width:160px;height:160px;object-fit:contain;border-radius:12px" /><p class="muted">暂无错题，继续保持</p></div>'
          : "";
      main.innerHTML =
        emptyArt +
        '<div class="card"><h2>' +
        icon("x-circle", "icon-sm") +
        ' 错题本</h2><p class="muted">' +
        all.length +
        " 题" +
        (missing ? "（已清理 " + missing + " 条失效）" : "") +
        '</p><div class="row">' +
        '<button type="button" class="btn ghost" data-f="all">全部</button>' +
        '<button type="button" class="btn ghost" data-f="edu">高教</button>' +
        '<button type="button" class="btn ghost" data-f="psy">心理</button>' +
        '<button type="button" class="btn ghost" data-f="law">道德法规</button>' +
        '<button type="button" class="btn" id="reWrong">重刷 ' +
        list.length +
        " 题</button></div></div>" +
        list
          .map(
            (q, i) =>
              '<div class="card"><div class="qhead"><div><span class="badge accent">' +
              (TYPE_LABEL[q.type] || "") +
              '</span><span class="badge">' +
              (subjName[q.subject] || q.subject) +
              '</span></div></div><div class="stem">' +
              escapeHtml(q.stem) +
              '</div><div class="row"><button type="button" class="btn ghost" data-off="' +
              i +
              '">移出</button></div></div>'
          )
          .join("");
      main.querySelectorAll("[data-f]").forEach((b) =>
        b.addEventListener("click", () => {
          filter = b.dataset.f;
          draw();
        })
      );
      main.querySelectorAll("[data-off]").forEach((b) =>
        b.addEventListener("click", () => {
          const q = list[parseInt(b.dataset.off, 10)];
          removeWrong(state, q.uid);
          JZ.saveState(state);
          renderWrong(main);
        })
      );
      const re = document.getElementById("reWrong");
      if (re)
        re.addEventListener("click", () => {
          if (!list.length) return;
          startSession(list.slice(), filter, "错题重刷");
        });
    }
    draw();
  }

  function assemblePaper(bank, opts) {
    const types =
      opts.types && opts.types.length
        ? opts.types
        : ["single", "multiple", "judge"];
    const pool = bank.filter(
      (q) =>
        types.indexOf(q.type) >= 0 &&
        (!opts.subject || opts.subject === "all" || q.subject === opts.subject)
    );
    if (opts.mode === "randomN") {
      return pickRandom(pool, opts.n || 20);
    }
    const quota = { single: 40, multiple: 20, judge: 20 };
    const picked = [];
    const used = new Set();
    const lack = [];
    ["single", "multiple", "judge"].forEach((t) => {
      if (types.indexOf(t) < 0) return;
      const seg = pickRandom(
        pool.filter((q) => q.type === t && !used.has(q.uid)),
        quota[t]
      );
      seg.forEach((q) => {
        used.add(q.uid);
        picked.push(q);
      });
      if (seg.length < quota[t]) lack.push(t + "不足" + quota[t]);
    });
    const totalWant = 80;
    if (picked.length < totalWant) {
      const rest = pickRandom(
        pool.filter((q) => !used.has(q.uid)),
        totalWant - picked.length
      );
      rest.forEach((q) => {
        used.add(q.uid);
        picked.push(q);
      });
    }
    picked.lackHint = lack.length ? lack.join("；") : "";
    return picked;
  }

  function renderExam(main) {
    const state = JZ.loadState();
    if (!examSession) {
      main.innerHTML =
        '<div class="card"><h2>' +
        icon("clock", "icon-sm") +
        ' 模拟考试</h2>' +
        '<p class="muted">默认 40 单选 + 20 多选 + 20 判断；多选全对才算对；交卷后显示答案。</p>' +
        '<div class="row"><label for="exMode">模式</label> <select id="exMode"><option value="classic">标准 80 题</option><option value="randomN">随机 N 题</option></select></div>' +
        '<div class="row"><label for="exN">N</label> <input id="exN" type="number" value="20" min="1" style="width:88px" disabled />' +
        '<label for="exMin">限时（分）</label> <select id="exMin"><option>30</option><option>60</option><option>90</option><option selected>100</option><option>120</option><option value="0">不限时</option></select></div>' +
        '<div class="row"><label><input type="checkbox" data-type="single" checked /> 单</label>' +
        '<label><input type="checkbox" data-type="multiple" checked /> 多</label>' +
        '<label><input type="checkbox" data-type="judge" checked /> 判</label></div>' +
        '<div class="row"><button type="button" class="btn" id="exGo">开始考试</button></div></div>' +
        '<div class="card"><h2>最近成绩</h2>' +
        (state.exams.length
          ? state.exams
              .map(
                (e) =>
                  '<p class="muted">' +
                  escapeHtml(e.at) +
                  " · " +
                  e.right +
                  "/" +
                  e.total +
                  " · " +
                  escapeHtml(e.modeLabel) +
                  "</p>"
              )
              .join("")
          : '<p class="muted">暂无记录</p>') +
        "</div>";
      const mode = document.getElementById("exMode");
      const nInput = document.getElementById("exN");
      mode.addEventListener("change", () => {
        nInput.disabled = mode.value !== "randomN";
      });
      document.getElementById("exGo").addEventListener("click", () => {
        const types = Array.from(
          main.querySelectorAll("input[data-type]:checked")
        ).map((x) => x.dataset.type);
        const opts = {
          mode: mode.value,
          n: parseInt(nInput.value || "20", 10),
          types: types,
          subject: "all",
        };
        const list = assemblePaper(window.BANK, opts);
        if (!list.length) {
          alert("题量不足，无法组卷");
          return;
        }
        const minutes = parseInt(document.getElementById("exMin").value, 10);
        examSession = {
          list: list,
          idx: 0,
          answers: {},
          deadline: minutes > 0 ? Date.now() + minutes * 60000 : null,
          modeLabel: opts.mode === "classic" ? "标准卷" : "随机" + opts.n,
          lackHint: list.lackHint || "",
          submitted: false,
          timer: null,
        };
        if (examSession.lackHint)
          alert("题型不足已自动补齐：" + examSession.lackHint);
        drawExam(main);
      });
      return;
    }
    drawExam(main);
  }

  function drawExam(main) {
    const s = examSession;
    if (!s || s.submitted) return drawExamResult(main);
    const q = s.list[s.idx];
    const left = s.deadline
      ? Math.max(0, Math.floor((s.deadline - Date.now()) / 1000))
      : null;
    const timeTxt =
      left == null
        ? "不限时"
        : "剩余 " +
          Math.floor(left / 60) +
          ":" +
          String(left % 60).padStart(2, "0");
    main.innerHTML =
      '<div class="card"><div class="qhead"><div><span class="badge accent">' +
      (TYPE_LABEL[q.type] || "") +
      '</span><span class="badge">' +
      s.modeLabel +
      '</span></div><div class="qindex" id="exClock">' +
      (s.idx + 1) +
      "/" +
      s.list.length +
      " · " +
      timeTxt +
      '</div></div><div class="stem">' +
      escapeHtml(q.stem) +
      '</div><div id="opts"></div><div class="row">' +
      '<button type="button" class="btn ghost" id="exPrev">上一题</button>' +
      '<button type="button" class="btn ghost" id="exNext">下一题</button>' +
      '<button type="button" class="btn" id="exSubmit">交卷</button></div></div>';
    const opts = document.getElementById("opts");
    const choices =
      q.type === "judge"
        ? [
            { id: "TRUE", value: "正确" },
            { id: "FALSE", value: "错误" },
          ]
        : q.options;
    const saved = s.answers[q.uid] || [];
    opts.innerHTML = choices
      .map((o) => {
        const sel = saved.indexOf(o.id) >= 0 ? " selected" : "";
        return (
          '<button type="button" class="opt' +
          sel +
          '" data-id="' +
          o.id +
          '"><span class="bubble">' +
          bubbleLabel(o.id) +
          '</span><span class="otext">' +
          escapeHtml(o.value) +
          "</span></button>"
        );
      })
      .join("");
    opts.querySelectorAll(".opt").forEach((btn) => {
      btn.addEventListener("click", () => {
        const id = btn.dataset.id;
        let cur = (s.answers[q.uid] || []).slice();
        if (q.type === "multiple") {
          const i = cur.indexOf(id);
          if (i >= 0) cur.splice(i, 1);
          else cur.push(id);
          btn.classList.toggle("selected");
        } else {
          cur = [id];
          opts.querySelectorAll(".opt").forEach((b) =>
            b.classList.remove("selected")
          );
          btn.classList.add("selected");
        }
        s.answers[q.uid] = cur;
      });
    });
    document.getElementById("exPrev").addEventListener("click", () => {
      if (s.idx > 0) s.idx -= 1;
      drawExam(main);
    });
    document.getElementById("exNext").addEventListener("click", () => {
      if (s.idx < s.list.length - 1) s.idx += 1;
      drawExam(main);
    });
    document
      .getElementById("exSubmit")
      .addEventListener("click", () => submitExam(main, false));
    if (s.deadline) {
      if (s.timer) clearInterval(s.timer);
      s.timer = setInterval(() => {
        if (!examSession || examSession.submitted) return;
        if (Date.now() >= s.deadline) {
          clearInterval(s.timer);
          submitExam(document.getElementById("main"), true);
        } else {
          const el = document.getElementById("exClock");
          if (el && s.list[s.idx]) {
            const sec = Math.max(
              0,
              Math.floor((s.deadline - Date.now()) / 1000)
            );
            el.textContent =
              s.idx +
              1 +
              "/" +
              s.list.length +
              " · 剩余 " +
              Math.floor(sec / 60) +
              ":" +
              String(sec % 60).padStart(2, "0");
          }
        }
      }, 1000);
    }
  }

  function submitExam(main, auto) {
    const s = examSession;
    if (!s || s.submitted) return;
    s.submitted = true;
    if (s.timer) clearInterval(s.timer);
    let right = 0;
    s.list.forEach((q) => {
      const ok = JZ.scoreAnswer(q.type, s.answers[q.uid] || [], q.answer);
      if (ok) right += 1;
    });
    const state = JZ.loadState();
    state.exams.unshift({
      at: new Date().toISOString().slice(0, 16).replace("T", " "),
      right: right,
      total: s.list.length,
      modeLabel: s.modeLabel + (auto ? "（自动交卷）" : ""),
    });
    state.exams = state.exams.slice(0, 20);
    JZ.saveState(state);
    drawExamResult(main, right, auto);
  }

  function drawExamResult(main, rightArg, auto) {
    const s = examSession;
    if (!s) return renderExam(main);
    let right = rightArg;
    if (right == null) {
      right = s.list.reduce(
        (n, q) =>
          n + (JZ.scoreAnswer(q.type, s.answers[q.uid] || [], q.answer) ? 1 : 0),
        0
      );
    }
    main.innerHTML =
      '<div class="card"><h2>' +
      icon("check-circle", "icon-sm") +
      " 考试结果" +
      (auto ? "（到时自动交卷）" : "") +
      '</h2><p class="stem">' +
      right +
      " / " +
      s.list.length +
      '</p><div class="row"><button type="button" class="btn" id="exDone">返回</button>' +
      '<button type="button" class="btn ghost" id="exToWrong">错题入本</button></div></div>' +
      s.list
        .map((q) => {
          const ok = JZ.scoreAnswer(q.type, s.answers[q.uid] || [], q.answer);
          const you = (s.answers[q.uid] || []).join("") || "—";
          return (
            '<div class="card"><div class="qhead"><div><span class="badge accent">' +
            (TYPE_LABEL[q.type] || "") +
            '</span></div><div class="qindex ' +
            (ok ? "tag-ok" : "tag-bad") +
            '">' +
            (ok ? "对" : "错") +
            '</div></div><div class="stem">' +
            escapeHtml(q.stem) +
            '</div><p class="muted">你的答案 ' +
            escapeHtml(you) +
            " · 正确 " +
            escapeHtml(q.answer.join("")) +
            "</p></div>"
          );
        })
        .join("");
    document.getElementById("exDone").addEventListener("click", () => {
      examSession = null;
      renderExam(main);
    });
    document.getElementById("exToWrong").addEventListener("click", () => {
      const state = JZ.loadState();
      s.list.forEach((q) => {
        if (!JZ.scoreAnswer(q.type, s.answers[q.uid] || [], q.answer))
          addWrong(state, q);
      });
      JZ.saveState(state);
      alert("错题已入本");
    });
  }

  function renderMe(main) {
    const state = JZ.loadState();
    const total = window.BANK.length;
    main.innerHTML =
      '<div class="card"><h2>' +
      icon("user", "icon-sm") +
      ' 我的</h2>' +
      '<div class="stat-grid"><div class="stat"><div class="n">' +
      total +
      '</div><div class="l">题库</div></div><div class="stat"><div class="n">' +
      state.wrong.length +
      '</div><div class="l">错题</div></div><div class="stat"><div class="n">' +
      state.exams.length +
      '</div><div class="l">模考</div></div></div>' +
      '<p class="muted" style="margin-top:12px">多选计分：全对才算对（固定）</p>' +
      '<label><input type="checkbox" id="autoOff" ' +
      (state.settings.autoRemoveWrong ? "checked" : "") +
      " /> 错题做对后自动移出</label>" +
      '<div class="row"><button type="button" class="btn danger" id="clearAll">清空进度与错题</button></div></div>';
    document.getElementById("autoOff").addEventListener("change", (e) => {
      state.settings.autoRemoveWrong = e.target.checked;
      JZ.saveState(state);
    });
    document.getElementById("clearAll").addEventListener("click", () => {
      if (!confirm("确认清空错题与进度？")) return;
      const s = emptyState();
      s.settings = state.settings;
      JZ.saveState(s);
      renderMe(main);
    });
  }

  document.getElementById("tabbar").addEventListener("click", (e) => {
    const btn = e.target.closest("button[data-tab]");
    if (btn) showTab(btn.dataset.tab);
  });

  window.JZ = {
    scoreAnswer: scoreAnswer,
    loadState: loadState,
    saveState: saveState,
    showTab: showTab,
    bankReady: bankReady,
    TYPE_LABEL: TYPE_LABEL,
    assemblePaper: assemblePaper,
    pickRandom: pickRandom,
  };
  showTab("practice");
})();
</script>
