name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "index.html"
      - "bank.js"
      - "assets/**"
      - "manifest.json"
      - ".github/workflows/build-apk.yml"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Sync web assets into WebView
        run: |
          mkdir -p android/app/src/main/assets/www/assets/icons
          cp index.html bank.js manifest.json android/app/src/main/assets/www/
          cp assets/design-tokens.css android/app/src/main/assets/www/assets/
          cp assets/empty-state.png android/app/src/main/assets/www/assets/
          cp assets/icons/icon-192.png assets/icons/icon-512.png assets/icons/apple-touch-icon.png \
            android/app/src/main/assets/www/assets/icons/
          # file:// 加载，避免 service worker 干扰
          rm -f android/app/src/main/assets/www/sw.js

      - name: Install Gradle 8.5
        run: |
          curl -fsSL https://services.gradle.org/distributions/gradle-8.5-bin.zip -o /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.5/bin" >> $GITHUB_PATH

      - name: Accept Android SDK licenses & install platform
        uses: android-actions/setup-android@v3

      - name: Build debug APK
        working-directory: android
        run: |
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jiaozhi-quiz-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
