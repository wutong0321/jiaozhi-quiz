name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android cmdline-tools
        run: |
          set -e
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          cd "$HOME/android-sdk/cmdline-tools"
          curl -fsSL "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip" -o tools.zip
          unzip -q tools.zip
          rm -rf latest
          mv cmdline-tools latest
          echo "ANDROID_HOME=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$HOME/android-sdk/platform-tools" >> "$GITHUB_PATH"

      - name: Install Android SDK packages
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Sync web assets
        run: |
          set -e
          mkdir -p android/app/src/main/assets/www/assets/icons
          cp index.html bank.js android/app/src/main/assets/www/
          cp assets/design-tokens.css android/app/src/main/assets/www/assets/
          cp assets/empty-state.png android/app/src/main/assets/www/assets/
          cp assets/icons/icon-192.png assets/icons/icon-512.png assets/icons/apple-touch-icon.png \
            android/app/src/main/assets/www/assets/icons/

      - name: Write local.properties
        run: echo "sdk.dir=$ANDROID_HOME" > android/local.properties

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: jiaozhi-quiz-apk
          path: android/app/build/outputs/apk/debug/*.apk
